repo_url: https://github.com/maxencefaldor/cax

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            show_root_heading: true
            members_order: source
            show_source: true
            inherited_members: true
            docstring_style: google
  - mkdocs-jupyter:
      execute: false
      include_source: false

strict: true

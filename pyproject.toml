[project]
name = "cax"
version = "0.4.3"
description = "Cellular Automata Accelerated in JAX"
authors = [{ name="Maxence Faldor", email="maxencefaldor@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
	"jax>=0.10.0",
	"flax>=0.12.6",
	"optax>=0.2.8",
	"pillow>=12.3.0",
]
keywords = [
	"complex systems",
	"artificial life",
	"open-endedness",
	"emergence",
	"self-organization",
	"cellular automata",
	"neural cellular automata",
]
classifiers = [
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
]

[dependency-groups]
dev = [
	"pytest>=8.3.0",
	"pytest-cov>=5.0.0",
	"pytest-xdist>=3.5.0",
	"ruff>=0.15.0",
	"ty>=0.0.38",
]

[project.optional-dependencies]
docs = [
	"mkdocs>=1.6.0",
	"mkdocs-material>=9.7.0",
	"mkdocstrings[python]>=1.0.0",
	"mkdocs-jupyter>=0.26.0",
]
examples = [
	"torchvision>=0.21.0",
	"tqdm>=4.67.0",
	"evosax>=0.2.0",
	"ipykernel>=6.29.0",
	"ipywidgets>=8.1.0",
	"mediapy>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/maxencefaldor/cax"
Documentation = "https://maxencefaldor.github.io/cax/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src", "tests"]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "N", "PERF", "PT", "RUF", "SIM", "UP", "W"]
ignore = [
	"D203",  # incorrect-blank-line-before-class
	"D206",  # docstring-tab-indentation
	"D213",  # multi-line-summary-second-line
	"N803",  # non-lowercase-variable-in-function
	"N806",  # invalid-argument-name
	"W191",  # tab-indentation
]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = [
	"B007",  # unused-loop-control-variable
	"B905",  # zip-without-explicit-strict
	"F811",  # redefined-while-unused
	"RUF005",  # collection-literal-concatenation
	"RUF059",  # unused-unpacked-variable
]

[tool.ruff.format]
indent-style = "tab"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
# JAX's type stubs are imprecise — e.g., jnp.roll, jnp.mgrid, nnx.Param arithmetic
replace-imports-with-any = ["flax.**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
	"error::DeprecationWarning",
	"error::FutureWarning",
]

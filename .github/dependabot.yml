# Keeps the pinned action versions current: one weekly PR per stale action.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps uv.lock current: one weekly PR per stale dependency.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

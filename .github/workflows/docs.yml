name: docs

# Build on every change that can break the docs; deploy only from main.
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "examples/**"
      - "src/**.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --extra docs

      # The examples are committed stripped; their outputs are built on demand
      # (docs/scripts/execute.py) and published as a release asset, so the repository
      # never carries them. Missing or broken, the docs still build from the sources.
      - name: Fetch executed notebooks
        continue-on-error: true
        run: |
          gh release download docs-notebooks --pattern notebooks.tar.gz --clobber
          tar xzf notebooks.tar.gz
          rm notebooks.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build (strict)
        run: uv run mkdocs build --clean

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: ./site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

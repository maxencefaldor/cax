name: ruff

on:
  push:
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yml"
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/ruff.yml"
  workflow_dispatch:

concurrency:
  group: ruff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Use ruff twice for linting and formatting.
      # See https://github.com/astral-sh/ruff-action/issues/23#issuecomment-2525574730
      # version-file pins the action to the project's own ruff, so CI and local
      # runs can never disagree about a rule.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "pyproject.toml"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "pyproject.toml"
          args: "format --check"

name: ty

on:
  push:
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/ty.yml"
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/ty.yml"
  workflow_dispatch:

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Type check
        run: uv run ty check

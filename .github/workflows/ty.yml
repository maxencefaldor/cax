name: ty

on:
  push:
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/ty.yml"
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/ty.yml"
  workflow_dispatch:

concurrency:
  group: ty-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Type check
        run: uv run ty check

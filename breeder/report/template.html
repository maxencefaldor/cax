<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NAME__ — population</title>
<style>
__STYLE__
</style>
</head>
<body>
<header>
	<div class="masthead">
		<div class="identity">
			<h1>__NAME__</h1>
			<div class="defs">fitness <b id="def-fitness"></b><span class="sep">·</span>descriptor <b id="def-descriptor"></b></div>
		</div>
		<div class="stats">
			<div class="stat"><span>individuals</span><b id="chip-count"></b></div>
			<div class="stat"><span>valid</span><b id="chip-valid"></b></div>
			<div class="stat"><span>best fitness</span><b id="chip-best"></b></div>
			<div class="stat"><span>diversity</span><b id="chip-diversity"></b></div>
			<div class="stat"><span>vendi</span><b id="chip-vendi"></b></div>
			<div class="stat"><span>vendi cos</span><b id="chip-vendi-cos"></b></div>
		</div>
	</div>
	<nav>
		<button data-tab="individuals" class="active">Individuals</button>
		<button data-tab="map">Map</button>
		<button data-tab="progress">Progress</button>
		<button data-tab="config">Config</button>
	</nav>
</header>

<section id="tab-individuals">
	<div class="toolbar">
		<label>sort
			<select id="sort">
				<option value="fitness">fitness</option>
			</select>
		</label>
		<button id="direction" title="toggle order">↓</button>
		<label>show <input id="count" type="number" value="256" min="1" step="64"></label>
		<label class="toggle"><input id="valid-only" type="checkbox"> valid only</label>
		<span class="spacer"></span>
		<span id="shown-count" class="hint"></span>
	</div>
	<div id="grid"></div>
</section>

<section id="tab-map" hidden>
	<canvas id="map"></canvas>
	<div class="caption">
		Population in reference space (PCA). Fitness
		<span class="ramp"></span> brighter&nbsp;=&nbsp;fitter, gray&nbsp;=&nbsp;invalid.
		Hover to preview, click to inspect.
	</div>
</section>

<section id="tab-progress" hidden>
	<div id="charts"></div>
	<div class="caption" id="progress-caption"></div>
</section>

<section id="tab-config" hidden><pre id="config-yaml"></pre></section>

<div id="preview"><video muted loop autoplay playsinline></video><div class="meta"></div></div>

<aside id="inspector" hidden aria-label="individual details">
	<div class="media"><video muted loop autoplay playsinline></video></div>
	<div class="head">
		<span class="who"><b class="id"></b><span class="rank"></span></span>
		<button class="close" title="close (Esc)">✕</button>
	</div>
	<table class="metrics"></table>
</aside>

<script>
const report = __REPORT__;
__SCRIPT__
</script>
</body>
</html>

# Fixed pretrained descriptor: the third descriptor family, beside learned and
# hand-crafted. VGG activations are memory-heavy during evaluation, so the minibatch
# drops to 32 — that keeps the first conv layer near 4 GB on-device instead of 32.
name: lenia_vgg
encoder:
  name: vgg
descriptor:
  series: [[vgg, 1.0]]
qd:
  minibatch_size: 32

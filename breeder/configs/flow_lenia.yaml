# Flow Lenia (arXiv:2212.07906): Lenia with a mass-conserving update. Its genotype space
# is Lenia's, but the catalogued solitons are not its solitons, so it seeds from the
# paper's random patch and starts from a full random population.
name: flow_lenia
complex_system:
  name: flow_lenia
qd:
  num_init: 1024
